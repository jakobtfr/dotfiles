# AEROSPACE CONFIG
#https://github.com/agenttank/dotfiles_macos/blob/main/aerospace/aerospace.toml
start-at-login = true

after-login-command = []

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center'
]

on-focus-changed = [
  'move-mouse window-lazy-center',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'

automatically-unhide-macos-hidden-apps = false

key-mapping.preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

cmd-q = [
  'close --quit-if-last-window'
]

ctrl-alt-f = 'fullscreen'

ctrl-alt-left = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop left'
ctrl-alt-down = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop down'
ctrl-alt-up = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop up'
ctrl-alt-right = 'focus --boundaries all-monitors-outer-frame --boundaries-action stop right'

ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-down = 'move down'
ctrl-alt-shift-up = 'move up'
ctrl-alt-shift-right = 'move right'

ctrl-alt-a = 'workspace --auto-back-and-forth A'  # AI
ctrl-alt-b = 'workspace --auto-back-and-forth B'  # Browser
ctrl-alt-c = 'workspace --auto-back-and-forth C'  # Chat
ctrl-alt-l = 'workspace --auto-back-and-forth L'  # Learning
ctrl-alt-m = 'workspace --auto-back-and-forth M'  # Music
ctrl-alt-n = 'workspace --auto-back-and-forth N'  # Notes
ctrl-alt-t = 'workspace --auto-back-and-forth T'  # Terminal
ctrl-alt-1 = 'workspace --auto-back-and-forth 1'  # Scratch
ctrl-alt-2 = 'workspace --auto-back-and-forth 2'  # Scratch
ctrl-alt-3 = 'workspace --auto-back-and-forth 3'  # Scratch
ctrl-alt-4 = 'workspace --auto-back-and-forth 4'  # Scratch
ctrl-alt-5 = 'workspace --auto-back-and-forth 5'  # Scratch
ctrl-alt-0 = 'workspace --auto-back-and-forth 0'  # Secondary monitor

ctrl-alt-shift-a = 'move-node-to-workspace A'
ctrl-alt-shift-b = 'move-node-to-workspace B'
ctrl-alt-shift-c = 'move-node-to-workspace C'
ctrl-alt-shift-l = 'move-node-to-workspace L'
ctrl-alt-shift-m = 'move-node-to-workspace M'
ctrl-alt-shift-n = 'move-node-to-workspace N'
ctrl-alt-shift-t = 'move-node-to-workspace T'
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-0 = 'move-node-to-workspace 0'

ctrl-alt-semicolon = 'mode service'
ctrl-alt-esc = 'enable off'  # Re-enable via menu bar or `aerospace enable on`
ctrl-alt-tab = 'focus-monitor next --wrap-around'
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

[workspace-to-monitor-force-assignment]
    0 = ['secondary', 'main']  # Falls back to main without a second monitor

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

# Browser
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace B']

# Terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace T']

# Notes
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace N']

# AI
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace A']

# Learning
[[on-window-detected]]
if.app-id = 'net.ankiweb.anki'
run = ['move-node-to-workspace L']

# Chat
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace C']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace C']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace C']

# Music
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace M']
